[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-iii-comal"
version = "0.1.0"
description = "Adapter-only CoMAL reproduction and diagnostics for MIMIC-III"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.1",
  "transformers>=4.35",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "tqdm>=4.65",
  "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
mimic-comal = "mimic_comal.cli:main"

[tool.setuptools.packages.find]
include = ["mimic_comal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
