[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al-mimic"
version = "0.2.0"
description = "Extensible multimodal active learning for clinical prediction tasks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "orjson>=3.9",
  "h5py>=3.9",
  "transformers>=4.40,<5",
  "torchvision>=0.16",
  "Pillow>=10",
  "iterative-stratification>=0.1.9",
  "pandas>=2.0",
]

[project.optional-dependencies]
mds-ed = ["pandas>=2.0", "wfdb>=4.1"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
al-mimic = "al_mimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["al_mimic*"]

[tool.setuptools.package-data]
"al_mimic.tasks.mds_ed" = ["LICENSE", "NOTICE"]
"al_mimic.tasks.mimic_iii" = ["protocol_profiles.yaml"]
"al_mimic.tasks.mimic_iii.preprocessing" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["thirdparty", "third_party", "CoMAL-main", "MDS-ED-main"]

[tool.ruff.lint]
select = ["E", "F", "I"]
