extends: mimic_smoke.yaml

experiment:
  name: mimic_iii_mosaic_smoke

model:
  modality_dropout: 0.15

active_learning:
  strategy: mosaic

mosaic:
  eta: 0.25
  partners: 2
  mixup_closure_samples: 16
  workset_size: 40
  synergy_workset_size: 20
  lambda_alpha: 1.0
  damping: 0.1
  fusion_batch_size: 128
  value_batch_size: 128
  deflation_steps: 2
