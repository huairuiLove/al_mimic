experiment:
  name: brset_v1_0_2_resnet50_metadata_comal
  output_root: ../../../experiments

task:
  family: brset

dataset:
  version: 1.0.2
  root: ../../../dataset/raw/brset-1.0.2
  labels_csv: label_brset.csv
  images_dir: fundus_photos
  prepared_dir: ../../../dataset/prepared/brset_v1_0_2

preprocessing:
  expected_images: 16266
  expected_patients: 8524
  expected_labels: 13
  split_protocol: patient_multilabel_stratified_60_20_20
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  query_unit: patient
  include_inadequate_images: true
  resize_size: 256
  image_size: 224
  minimum_comorbidity_count: 10
  metadata:
    numeric: [patient_age, diabetes_time_y]
    categorical: [camera, insulin, patient_sex, exam_eye, diabetes]
    comorbidity: comorbidities

model:
  architecture: brset_resnet50_metadata_fusion
  initialization: imagenet_resnet50_fresh_fusion_each_round
  image_weights: IMAGENET1K_V2
  output_activation: sigmoid
  seed: 1337
  image_feature_dim: 2048
  metadata_hidden_dim: 128
  fusion_dim: 512
  output_size: 13
  dropout: 0.2

comal:
  label_dim: 8
  prototype_dim: 8
  temperature: 0.07
  learning_rate: 0.001
  reconstruction_weight: 0.2
  classification_weight: 0.5
  anchor_chunk_size: 1024
  contrastive_label_sample_size: 13
  cross_modal_weight: 0.15
  negative_prototype: shared_background

training:
  seed: 17
  device: cuda
  precision: fp32
  optimizer: adam
  loss: binary_cross_entropy
  batch_size: 8
  eval_batch_size: 64
  comal_batch_size: 64
  epochs: 20
  comal_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip: 1.0
  inherit_across_rounds: false
  num_workers: 12
  pin_memory: true
  allow_tf32: false
  cudnn_benchmark: false

active_learning:
  strategy: comal
  query_unit: patient
  patient_score_aggregation: fused_patient_representation
  initial_fraction: 0.10
  query_fraction: 0.05
  rounds: 6

acquisition:
  formula: paper
