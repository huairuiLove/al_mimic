# Scenario A: withhold the clinical note from part of the pool.
#
# The official cohort has a note on every visit, so no candidate is informative
# through one modality rather than another and multimodal acquisition has
# nothing to select on. Missingness is concentrated on visits carrying few
# diagnoses, which are the ones a note would most help, so a strategy that can
# tell which modality a candidate is informative through has something to gain.
#
# Applied to all three splits: a test set where every note is present would
# measure a distribution the model never trains on.

extends: ../../tasks/mimic_iii/icd9_diagnoses.yaml

scenario:
  name: missing_notes_40pct_label_sparse
  missing_notes:
    rate: 0.4
    bias: label_sparse
    strength: 1.0
    seed: 20260812
    splits: [train, val, test]
