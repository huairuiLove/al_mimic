extends: mimic_comal.yaml

experiment:
  name: mimic_iii_smoke

dataset:
  prepared_dir: prepared/mimic_iii_smoke
  feature_dir: prepared/mimic_iii_smoke/features

preprocessing:
  max_records: 500
  label_top_k: 8
  min_label_frequency: 1
  max_text_chars: 2000

features:
  dimension: 32
  max_features: 2000
  min_df: 1
  ngram_range: [1, 1]

model:
  hidden_dims: [64, 32]

comal:
  label_dim: 8
  prototype_dim: 8
  anchor_chunk_size: 128

training:
  device: cpu
  batch_size: 64
  comal_batch_size: 8
  eval_batch_size: 128
  epochs: 1
  comal_epochs: 1
  num_workers: 0
  pin_memory: false
  cpu_threads: 4

active_learning:
  initial_labeled: 40
  query_size: 20
  candidate_size: 100
  rounds: 2

