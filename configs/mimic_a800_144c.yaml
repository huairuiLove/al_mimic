experiment:
  name: mimic_iii_comal_a800
  output_root: experiments

dataset:
  root: mimic-iii-clinical-database-1.4
  prepared_dir: prepared/mimic_iii
  feature_dir: prepared/mimic_iii/features_multimodal_scratch

preprocessing:
  seed: 17
  train_fraction: 0.8
  validation_fraction: 0.1
  note_categories: [Discharge summary]
  max_notes_per_admission: 4
  max_text_chars: 12000
  code_prefix_length: 3
  label_top_k: 50
  min_label_frequency: 100
  max_records: null

features:
  encoder: multimodal_scratch
  dimension: 256
  max_features: 100000
  min_df: 2
  max_df: 0.995
  ngram_range: [1, 2]
  seed: 17
  svd_n_iter: 7
  transform_batch_size: 8192
  joblib_compress: 0
  measurement_window_hours: 48
  measurement_bin_hours: 2

model:
  architecture: multimodal_transformer_scratch
  initialization: random
  fusion_dim: 256
  num_heads: 8
  measurement_layers: 2
  fusion_layers: 2
  dropout: 0.1

comal:
  label_dim: 64
  prototype_dim: 64
  temperature: 0.07
  learning_rate: 0.001
  reconstruction_weight: 0.2
  classification_weight: 0.5
  anchor_chunk_size: 4096
  negative_prototype: shared_background

training:
  seed: 17
  device: cuda
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  gpu_resident_features: true
  fused_optimizer: true
  torch_compile: false
  batch_size: 4096
  eval_batch_size: 16384
  comal_batch_size: 192
  epochs: 20
  comal_epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  maximum_pos_weight: 20
  gradient_clip: 5.0
  gradient_clip_interval: 1
  threshold: 0.5
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true
  cpu_threads: 18
  interop_threads: 2
  inherit_across_rounds: false

active_learning:
  strategy: comal
  initial_labeled: 3000
  query_size: 1000
  candidate_size: 49152
  rounds: 6

acquisition:
  formula: paper
  uncertainty_weight: 0.5
  prototype_weight: 0.35
  cardinality_weight: 0.15
