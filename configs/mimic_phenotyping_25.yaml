experiment:
  name: mimic_iii_phenotyping_25_comal
  output_root: experiments

task:
  id: phenotyping_25
  native_multilabel: true
  query_unit: icu_stay

dataset:
  prepared_dir: prepared/mimic_phenotyping_25
  split_hdf5: data/mimic_phenotyping_25/splits.hdf5
  split_group: with_notes
  clinicalbert_checkpoint: pretrained/clinicalbert/pytorch_model.bin

preprocessing:
  cohort: mimic3_benchmark_multimodal
  task: Phenotyping
  timestep_hours: 1
  max_time_steps: 256
  max_note_tokens: 512
  expected_total_samples: null
  expected_label_count: 25
  time_invariant_dim: 0
  time_series_dim: 76
  split_protocol: mimic3_benchmark_subject_split
  label_format: mimic3_benchmark_acute_care_multihot
  note_protocol: all_stay_notes_chronological_512
  require_positive_label_per_sample: false

model:
  architecture: clinicalbert_measurement_fusion
  initialization: clinicalbert_pretrained_fresh_fusion_each_round
  output_activation: sigmoid
  seed: 1337
  text_hidden_dim: 768
  time_invariant_hidden_dim: 0
  time_series_hidden_dim: 256
  time_series_layers: 3
  time_series_heads: 8
  time_series_pooling: masked_mean
  output_size: 25
  dropout: 0.1

comal:
  label_dim: 8
  prototype_dim: 8
  temperature: 0.07
  learning_rate: 0.001
  reconstruction_weight: 0.2
  classification_weight: 0.5
  anchor_chunk_size: 1024
  contrastive_label_sample_size: 25
  cross_modal_weight: 0.15
  negative_prototype: shared_background

training:
  seed: 17
  device: cuda
  precision: fp32
  optimizer: adamw
  loss: binary_cross_entropy
  batch_size: 40
  eval_batch_size: 400
  epochs: 80
  optimizer_steps_per_round: 1200
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  learning_rate: 0.0001
  bert_learning_rate: 0.00002
  bert_layerwise_lr_decay: 0.95
  weight_decay: 0.01
  warmup_proportion: 0.1
  gradient_clip: 1.0
  inherit_across_rounds: false
  num_workers: 12
  pin_memory: true
  allow_tf32: false
  cudnn_benchmark: false

active_learning:
  strategy: comal
  initial_fraction: 0.01
  query_fraction: 0.01
  rounds: 6

evaluation:
  primary_metric: macro_auprc
  metrics:
    - macro_auprc
    - micro_auprc
    - macro_auroc
    - micro_auroc

acquisition:
  formula: paper
